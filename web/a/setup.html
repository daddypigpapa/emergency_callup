<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비상 인력동원 설정</title>
<link rel="stylesheet" href="/a/a.css?v=1">
<link rel="stylesheet" href="/a/setup.css?v=1">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css?v=1">
</head>
<body>
<div class="setup-wrap">
  <div class="setup-header">
    <a id="backLink" href="/a/index.html" class="back-link">← 상황판으로</a>
    <h1>관리자 설정</h1>
  </div>
  <div class="setup-tabs">
    <button class="tab active" data-panel="members">명단</button>
    <button class="tab" data-panel="areas">임무지역</button>
    <button class="tab" data-panel="teamplan">조별계획</button>
    <button class="tab" data-panel="presets">프리셋</button>
    <button class="tab" data-panel="map">지도</button>
    <button class="tab" data-panel="admins">관리자 계정</button>
    <button class="tab" data-panel="events">감사기록</button>
  </div>

  <section id="panel-members" class="panel active">
    <h2>명단 가져오기</h2>
    <div class="field-row">
      <input type="file" id="importFile" accept=".xlsx">
      <button class="action" id="importPreviewBtn">미리보기</button>
    </div>
    <div id="importResult"></div>
    <h2>등록된 인원</h2>
    <div id="memberTableWrap"></div>
  </section>

  <section id="panel-areas" class="panel">
    <h2>임무지역</h2>
    <div class="area-editor">
      <div class="area-map-wrap"><div id="areaMapEl" class="area-map"></div></div>
      <div class="area-side">
        <div id="areaListWrap"></div>

        <h3 id="areaFormTitle">새 지역</h3>
        <div class="field-row">
          <input id="areaName" placeholder="이름">
          <select id="areaKind">
            <option value="grid">격자</option>
            <option value="circle">원</option>
          </select>
        </div>

        <div id="gridFields">
          <div class="field-row">
            <select id="gridSize">
              <option value="100">100m 격자</option>
              <option value="250" selected>250m 격자</option>
              <option value="500">500m 격자</option>
              <option value="1000">1000m 격자</option>
            </select>
          </div>
          <div class="field-row">
            <button class="action tool-btn active" id="toolCellBtn" type="button">칸 선택</button>
            <button class="action tool-btn" id="toolDragBtn" type="button">드래그 선택</button>
            <button class="action tool-btn" id="toolDongBtn" type="button">행정동 선택</button>
            <button class="action" id="gridClearBtn" type="button">모두 지우기</button>
          </div>
          <p id="gridCellCount" class="hint">선택된 칸: 0개</p>
          <div id="dongSearch" class="field-row" hidden>
            <input id="dongQuery" placeholder="행정동 이름 (예: 삼덕동)">
            <button class="action" id="dongSearchBtn" type="button">검색</button>
          </div>
          <div id="dongResults"></div>
        </div>

        <div id="circleFields" hidden>
          <div class="field-row">
            <input id="areaLat" placeholder="위도" type="number" step="0.00001">
            <input id="areaLng" placeholder="경도" type="number" step="0.00001">
            <input id="areaRadius" placeholder="반경(m)" type="number">
          </div>
          <p class="hint">지도를 클릭하면 원의 중심이 그 위치로 이동합니다.</p>
        </div>

        <div class="field-row">
          <button class="action" id="areaSaveBtn" type="button">저장</button>
          <button class="action" id="areaCancelBtn" type="button" hidden>편집 취소</button>
        </div>
        <p id="areaFormStatus" class="hint"></p>
      </div>
    </div>
  </section>

  <section id="panel-teamplan" class="panel">
    <h2>조별 계획</h2>
    <p class="hint">평시에 조별 임무·임무지역·집결지·체크포인트를 미리 정해 두면, 발령 시 자동으로 채워집니다.</p>
    <div class="area-editor">
      <div class="area-map-wrap"><div id="planMapEl" class="area-map"></div></div>
      <div class="area-side">
        <div id="teamPlanList"></div>
        <div class="field-row">
          <button class="action" id="teamPlanSaveAllBtn" type="button">전체 저장</button>
        </div>
        <div id="teamPlanStatus"></div>
      </div>
    </div>
    <datalist id="missionPresetList"></datalist>
  </section>

  <section id="panel-presets" class="panel">
    <h2>프리셋</h2>
    <div class="field-row">
      <select id="presetKind">
        <option value="incident_type">발령종류</option>
        <option value="message">메시지</option>
        <option value="mission">임무</option>
      </select>
      <input id="presetText" placeholder="문구">
      <button class="action" id="presetCreateBtn">추가</button>
    </div>
    <div id="presetListWrap"></div>
  </section>

  <section id="panel-map" class="panel">
    <h2>지도 배경 (VWorld 인증키)</h2>
    <p>현장·관리자 화면의 지도 배경을 그리는 데 쓰는 키입니다. 담당자가 직접 발급받은
      키로 바꾸면 서버를 다시 켜지 않아도 바로 적용됩니다.
      <a href="https://www.vworld.kr" target="_blank" rel="noopener">VWorld에서 키 발급받기</a></p>
    <div class="field-row">
      <input id="tileKeyInput" class="wide-input" placeholder="예: 9AC4488D-662D-46CE-A40B-817DAEF03EBA">
      <button class="action" id="tileKeySaveBtn">저장</button>
    </div>
    <p id="tileKeyStatus" class="hint"></p>
  </section>

  <section id="panel-admins" class="panel">
    <h2>관리자 계정</h2>
    <div class="field-row">
      <input id="adminLoginId" placeholder="로그인ID">
      <input id="adminName" placeholder="이름">
      <input id="adminPw" placeholder="초기 비밀번호" type="password">
      <select id="adminRole"><option value="operator">operator</option><option value="admin">admin</option></select>
      <button class="action" id="adminCreateBtn">추가</button>
    </div>
    <div id="adminListWrap"></div>
  </section>

  <section id="panel-events" class="panel">
    <h2>감사기록</h2>
    <div class="field-row">
      <input id="eventsIncidentId" placeholder="사건 ID" type="number">
      <button class="action" id="eventsLoadBtn">조회</button>
    </div>
    <div id="eventsListWrap"></div>
  </section>
</div>
<script src="/vendor/leaflet/leaflet.js?v=1"></script>
<script type="module" src="/a/setup.js?v=1"></script>
</body>
</html>
